<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How the Internet Works — CS Visualized</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:     #050911;
  --bg2:    #090d18;
  --surf:   #0f1420;
  --bord:   #182030;
  --bord2:  #1e2a3e;

  --cyan:   #00d4ff;
  --green:  #00ff88;
  --orange: #ff7b00;
  --red:    #ff3366;
  --yellow: #ffd600;
  --purple: #7c3aed;
  --pink:   #f472b6;

  --text:   #cdd8f0;
  --dim:    #3a4860;
  --dim2:   #141c2e;

  --mono:    'IBM Plex Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
  --body:    'DM Sans', sans-serif;
}

html, body {
  width:100%; height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
}

/* noise */
body::after {
  content:''; position:fixed; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none; z-index:9999;
}

/* ── STAR FIELD ── */
#stars {
  position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
}
.star {
  position:absolute; border-radius:50%;
  background:white; opacity:0;
  animation:twinkle var(--d) ease-in-out infinite var(--delay);
}
@keyframes twinkle {
  0%,100%{opacity:0} 50%{opacity:var(--op)}
}

/* ── NAVBAR ── */
#navbar {
  position:fixed; top:0; left:0; right:0; height:56px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 2rem;
  border-bottom:1px solid var(--bord);
  background:rgba(5,9,17,0.88);
  backdrop-filter:blur(18px);
  z-index:200;
}
.nav-left { display:flex; align-items:center; gap:0.7rem; }
.nav-mark  { width:26px; height:26px; border-radius:6px; background:var(--cyan); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:0.6rem; font-weight:700; color:#000; }
.nav-name  { font-family:var(--body); font-weight:700; font-size:0.88rem; color:var(--text); }
.nav-name span { color:var(--cyan); }
.nav-sep   { width:1px; height:16px; background:var(--bord2); margin:0 0.2rem; }
.nav-topic { font-family:var(--mono); font-size:0.6rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--cyan); opacity:0.75; }
#phase-pill { font-family:var(--mono); font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; padding:0.28rem 0.85rem; border-radius:100px; border:1px solid var(--bord2); color:var(--dim); transition:all 0.5s; }

/* ── MAIN CANVAS AREA ── */
#stage {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:64px 1.5rem 58px;
  z-index:1;
  gap:0.8rem;
}

/* ── NETWORK DIAGRAM ── */
#net-diagram {
  width:100%; max-width:860px;
  position:relative;
  height:200px;
  flex-shrink:0;
}

/* SVG connection lines */
#lines-svg {
  position:absolute; inset:0;
  width:100%; height:100%;
  overflow:visible;
  z-index:1;
}

/* Nodes row */
#nodes-row {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:space-between;
  z-index:2;
}

/* ── NETWORK NODE ── */
.net-node {
  display:flex; flex-direction:column; align-items:center; gap:0.5rem;
  position:relative; flex-shrink:0;
}

.node-body {
  width:72px; height:72px;
  border-radius:14px;
  border:1.5px solid var(--bord2);
  background:var(--surf);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:3px;
  position:relative; overflow:hidden;
  transition: border-color 0.6s, box-shadow 0.6s, background 0.6s;
}

.node-body::before {
  content:''; position:absolute;
  top:0; left:0; right:0; height:1.5px;
  background:currentColor; opacity:0;
  transition:opacity 0.5s;
}

.node-icon { font-size:1.5rem; line-height:1; }
.node-label {
  font-family:var(--mono); font-size:0.52rem;
  letter-spacing:0.1em; text-transform:uppercase;
  color:var(--dim); transition:color 0.5s;
}
.node-sublabel {
  position:absolute; bottom:-20px;
  font-family:var(--mono); font-size:0.58rem;
  color:var(--dim); letter-spacing:0.08em; text-align:center;
  white-space:nowrap;
}

/* node active states */
.net-node.active .node-body {
  border-color:var(--node-color, var(--cyan));
  box-shadow: 0 0 24px color-mix(in srgb, var(--node-color, var(--cyan)) 40%, transparent);
  background: color-mix(in srgb, var(--node-color, var(--cyan)) 8%, var(--surf));
}
.net-node.active .node-body::before { opacity:0.4; color:var(--node-color, var(--cyan)); }
.net-node.active .node-label { color:var(--node-color, var(--cyan)); }

@keyframes nodePulse {
  0%,100%{transform:scale(1)} 50%{transform:scale(1.07)}
}
.net-node.pulsing .node-body { animation:nodePulse 0.7s ease; }

/* ── PACKET ── */
#packet {
  position:absolute;
  width:28px; height:28px;
  border-radius:8px;
  background:var(--cyan);
  display:flex; align-items:center; justify-content:center;
  font-size:0.8rem;
  z-index:10;
  top:50%; transform:translate(-50%,-50%);
  transition: left 1.1s cubic-bezier(0.4,0,0.2,1),
              background 0.4s,
              box-shadow 0.4s,
              top 0.4s;
  box-shadow:0 0 14px rgba(0,212,255,0.6);
  pointer-events:none;
  opacity:0;
}

#packet.visible { opacity:1; }

@keyframes packetPop {
  0%{transform:translate(-50%,-50%) scale(0.4)} 60%{transform:translate(-50%,-50%) scale(1.2)} 100%{transform:translate(-50%,-50%) scale(1)}
}
.packet-pop { animation:packetPop 0.5s cubic-bezier(0.34,1.5,0.64,1); }

/* packet trail */
.ptrail {
  position:absolute;
  width:6px; height:6px; border-radius:50%;
  pointer-events:none; z-index:9;
  animation:trailFade 0.8s ease forwards;
}
@keyframes trailFade { 0%{opacity:0.7;transform:scale(1)} 100%{opacity:0;transform:scale(0)} }

/* ── STEPS TIMELINE ── */
#timeline {
  width:100%; max-width:860px;
  display:flex; gap:4px; align-items:stretch;
}

.tstep {
  flex:1;
  background:var(--surf);
  border:1px solid var(--bord2);
  border-radius:8px;
  padding:0.6rem 0.5rem;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  transition:all 0.5s;
  cursor:default;
  position:relative; overflow:hidden;
}

.tstep::before {
  content:''; position:absolute;
  bottom:0; left:0; right:0; height:2px;
  background:var(--step-color, var(--cyan));
  transform:scaleX(0); transform-origin:left;
  transition:transform 0.6s ease;
}

.tstep.done::before { transform:scaleX(1); }

.tstep.active {
  border-color:var(--step-color, var(--cyan));
  background:color-mix(in srgb, var(--step-color, var(--cyan)) 6%, var(--surf));
  box-shadow:0 0 12px color-mix(in srgb, var(--step-color, var(--cyan)) 25%, transparent);
}

.tstep-num {
  font-family:var(--mono); font-size:0.52rem; color:var(--dim);
  letter-spacing:0.15em;
}
.tstep-name {
  font-family:var(--mono); font-size:0.6rem; font-weight:600;
  color:var(--dim); text-transform:uppercase; letter-spacing:0.08em;
  text-align:center; line-height:1.3;
  transition:color 0.4s;
}
.tstep.active .tstep-name,
.tstep.done  .tstep-name { color:var(--step-color, var(--cyan)); }

/* ── INFO PANEL ── */
#info-panel {
  width:100%; max-width:860px;
  background:var(--surf);
  border:1px solid var(--bord2);
  border-radius:12px;
  padding:1rem 1.5rem;
  display:grid; grid-template-columns:1fr auto;
  align-items:center; gap:2rem;
  min-height:72px;
}

#info-title {
  font-family:var(--display);
  font-size:1.5rem; letter-spacing:0.05em;
  transition:color 0.4s;
  line-height:1;
}

#info-desc {
  font-family:var(--mono); font-size:0.7rem;
  color:var(--dim); line-height:1.7;
  transition:all 0.4s;
  margin-top:0.3rem;
}

.info-badge {
  font-family:var(--mono); font-size:0.65rem;
  padding:0.4rem 1rem; border-radius:6px;
  border:1px solid; white-space:nowrap;
  letter-spacing:0.08em;
  flex-shrink:0;
}

/* ── LOG ── */
#log {
  width:100%; max-width:860px; height:52px;
  background:rgba(0,0,0,0.4);
  border:1px solid var(--bord);
  border-radius:10px;
  padding:0.45rem 1rem;
  overflow:hidden;
  display:flex; flex-direction:column; justify-content:flex-end; gap:1px;
  font-family:var(--mono); font-size:0.63rem;
}
.ll { display:flex; gap:0.5rem; opacity:0; transform:translateY(5px); animation:llIn 0.4s ease forwards; }
@keyframes llIn { to{opacity:1;transform:translateY(0)} }
.lt{color:var(--dim)} .lc{color:var(--cyan)} .lg{color:var(--green)}
.lo{color:var(--orange)} .lp{color:var(--pink)} .ly{color:var(--yellow)} .ls{color:var(--dim)}

/* ── BOTTOM BAR ── */
#botbar {
  position:fixed; bottom:0; left:0; right:0; height:50px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 2rem;
  border-top:1px solid var(--bord);
  background:rgba(5,9,17,0.88);
  backdrop-filter:blur(16px);
  z-index:200;
}
#status { font-family:var(--mono); font-size:0.68rem; color:var(--dim); transition:color 0.4s; max-width:70%; }
#replay-btn { font-family:var(--mono); font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.38rem 1.1rem; border-radius:6px; border:1px solid var(--bord2); background:transparent; color:var(--dim); cursor:pointer; transition:all 0.25s; }
#replay-btn:hover { border-color:var(--cyan); color:var(--cyan); }

/* ── OVERLAY ── */
#overlay {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:1.2rem;
  background:rgba(5,9,17,0.95);
  backdrop-filter:blur(10px);
  z-index:500; opacity:0; pointer-events:none;
  transition:opacity 0.5s; padding:2rem;
}
#overlay.show { opacity:1; pointer-events:all; }
.ov-icon  { font-size:3.2rem; animation:ovPop 0.55s cubic-bezier(0.34,1.5,0.64,1); }
@keyframes ovPop { 0%{transform:scale(0.2) rotate(-10deg)} 100%{transform:scale(1) rotate(0)} }
.ov-title { font-family:var(--display); font-size:clamp(2rem,5vw,4rem); letter-spacing:0.05em; text-align:center; }
.ov-sub   { font-family:var(--mono); font-size:0.8rem; color:var(--dim); line-height:1.9; text-align:center; max-width:520px; }
.ov-code  { font-family:var(--mono); font-size:0.75rem; background:var(--surf); border:1px solid var(--bord2); border-radius:10px; padding:1.1rem 1.8rem; line-height:2; text-align:left; white-space:pre; }
.ov-code .kw{color:var(--cyan)} .ov-code .fn{color:var(--green)} .ov-code .cm{color:var(--dim)} .ov-code .val{color:var(--yellow)}
.ov-tap { font-family:var(--mono); font-size:0.65rem; color:var(--dim); letter-spacing:0.2em; text-transform:uppercase; animation:blk 1.5s ease infinite; cursor:pointer; padding:0.5rem; }
@keyframes blk { 0%,100%{opacity:0.3} 50%{opacity:1} }
</style>
</head>
<body>

<!-- STARS -->
<div id="stars"></div>

<!-- NAVBAR -->
<nav id="navbar">
  <div class="nav-left">
    <div class="nav-mark">CS</div>
    <div class="nav-name">Visualized<span>.</span></div>
    <div class="nav-sep"></div>
    <div class="nav-topic">How the Internet Works</div>
  </div>
  <div id="phase-pill">READY</div>
</nav>

<!-- STAGE -->
<div id="stage">

  <!-- NETWORK DIAGRAM -->
  <div id="net-diagram">
    <svg id="lines-svg"></svg>
    <div id="nodes-row"></div>
    <div id="packet">📦</div>
  </div>

  <!-- TIMELINE -->
  <div id="timeline"></div>

  <!-- INFO PANEL -->
  <div id="info-panel">
    <div>
      <div id="info-title" style="color:var(--cyan)">READY</div>
      <div id="info-desc">Press replay to watch a browser request travel the internet.</div>
    </div>
    <div class="info-badge" id="info-badge" style="color:var(--dim);border-color:var(--bord2)">—</div>
  </div>

  <!-- LOG -->
  <div id="log"></div>

</div>

<!-- BOTTOM BAR -->
<div id="botbar">
  <div id="status">Initializing…</div>
  <button id="replay-btn" onclick="startAnim()">↺ Replay</button>
</div>

<!-- OVERLAY -->
<div id="overlay" onclick="closeOverlay()">
  <div class="ov-icon"  id="ov-icon">🌐</div>
  <div class="ov-title" id="ov-title">THE INTERNET</div>
  <div class="ov-sub"   id="ov-sub"></div>
  <div class="ov-code"  id="ov-code"></div>
  <div class="ov-tap"   id="ov-tap">[ tap to continue ]</div>
</div>

<script>
/* ══════════════════════════════════
   STAR FIELD
══════════════════════════════════ */
(function buildStars(){
  const c = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=Math.random()*2+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;
      --d:${2+Math.random()*4}s;--delay:-${Math.random()*4}s;--op:${0.2+Math.random()*0.5}`;
    c.appendChild(s);
  }
})();

/* ══════════════════════════════════
   NODES CONFIG
══════════════════════════════════ */
const NODES = [
  { id:'browser',  icon:'🖥️',  label:'Browser',  sub:'You',             color:'#00d4ff' },
  { id:'dns',      icon:'📖',  label:'DNS',       sub:'Name Resolver',   color:'#ffd600' },
  { id:'router',   icon:'📡',  label:'Router',    sub:'Your ISP',        color:'#ff7b00' },
  { id:'internet', icon:'🌐',  label:'Internet',  sub:'Backbone',        color:'#7c3aed' },
  { id:'server',   icon:'🖧',   label:'Server',    sub:'example.com',     color:'#00ff88' },
];

/* ══════════════════════════════════
   STEPS CONFIG
══════════════════════════════════ */
const STEPS = [
  { id:'dns',      name:'DNS\nLookup',      color:'#ffd600' },
  { id:'tcp',      name:'TCP\nHandshake',   color:'#00d4ff' },
  { id:'http',     name:'HTTP\nRequest',    color:'#ff7b00' },
  { id:'route',    name:'IP\nRouting',      color:'#7c3aed' },
  { id:'process',  name:'Server\nProcess',  color:'#00ff88' },
  { id:'response', name:'HTTP\nResponse',   color:'#f472b6' },
  { id:'render',   name:'Browser\nRender',  color:'#00d4ff' },
];

/* ══════════════════════════════════
   STATE
══════════════════════════════════ */
let running=false, timers=[], overlayResolve=null;
const delay = ms => new Promise(r=>{timers.push(setTimeout(r,ms));});
const $     = id  => document.getElementById(id);

/* ══════════════════════════════════
   BUILD DOM
══════════════════════════════════ */
function buildDiagram(){
  const row = $('nodes-row'); row.innerHTML='';
  NODES.forEach(n=>{
    const el=document.createElement('div');
    el.className='net-node'; el.id='node-'+n.id;
    el.style.setProperty('--node-color', n.color);
    el.innerHTML=`
      <div class="node-body">
        <div class="node-icon">${n.icon}</div>
        <div class="node-label">${n.label}</div>
      </div>
      <div class="node-sublabel">${n.sub}</div>`;
    row.appendChild(el);
  });
  drawLines();
}

function buildTimeline(){
  const tl=$('timeline'); tl.innerHTML='';
  STEPS.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='tstep'; el.id='step-'+s.id;
    el.style.setProperty('--step-color', s.color);
    el.innerHTML=`<div class="tstep-num">${String(i+1).padStart(2,'0')}</div>
                  <div class="tstep-name">${s.name}</div>`;
    tl.appendChild(el);
  });
}

function drawLines(){
  const svg=$('lines-svg'); svg.innerHTML='';
  const diagram=$('net-diagram');
  const nodes=diagram.querySelectorAll('.net-node');
  const dRect=diagram.getBoundingClientRect();
  const pts=[];
  nodes.forEach(n=>{
    const r=n.getBoundingClientRect();
    pts.push({ x:r.left-dRect.left+r.width/2, y:r.top-dRect.top+r.height/2 });
  });
  for(let i=0;i<pts.length-1;i++){
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',pts[i].x); line.setAttribute('y1',pts[i].y);
    line.setAttribute('x2',pts[i+1].x); line.setAttribute('y2',pts[i+1].y);
    line.setAttribute('stroke','rgba(30,42,62,0.8)'); line.setAttribute('stroke-width','1.5');
    line.setAttribute('stroke-dasharray','6 4');
    line.id='line-'+i;
    svg.appendChild(line);
  }
}

/* ══════════════════════════════════
   HELPERS
══════════════════════════════════ */
function setStatus(msg,color='var(--dim)'){
  $('status').textContent=msg; $('status').style.color=color;
}
function setPill(txt,color='var(--dim)'){
  const p=$('phase-pill'); p.textContent=txt; p.style.color=color; p.style.borderColor=color;
}
function setInfo(title,desc,badge,badgeColor='var(--cyan)'){
  $('info-title').textContent=title; $('info-title').style.color=badgeColor;
  $('info-desc').textContent=desc;
  $('info-badge').textContent=badge;
  $('info-badge').style.color=badgeColor;
  $('info-badge').style.borderColor=badgeColor;
}
function addLog(msg,cls='ls'){
  const el=$('log');
  while(el.children.length>=3) el.removeChild(el.children[0]);
  const line=document.createElement('div'); line.className='ll';
  const ts=document.createElement('span'); ts.className='lt'; ts.textContent=new Date().toISOString().substr(11,8);
  const m=document.createElement('span'); m.className=cls; m.textContent='  '+msg;
  line.appendChild(ts); line.appendChild(m); el.appendChild(line);
}

function activateNode(id){
  NODES.forEach(n=> $('node-'+n.id).classList.remove('active','pulsing'));
  const el=$('node-'+id);
  if(el){ el.classList.add('active'); void el.offsetWidth; el.classList.add('pulsing'); }
}
function dimAllNodes(){
  NODES.forEach(n=> $('node-'+n.id).classList.remove('active','pulsing'));
}

function activateStep(id){
  STEPS.forEach(s=>{ const e=$('step-'+s.id); e.classList.remove('active'); });
  const e=$('step-'+id); if(e) e.classList.add('active');
}
function doneStep(id){
  const e=$('step-'+id); if(e){ e.classList.remove('active'); e.classList.add('done'); }
}

/* ══════════════════════════════════
   PACKET MOVEMENT
══════════════════════════════════ */
function getNodeCenter(id){
  const diagram=$('net-diagram');
  const node=$('node-'+id);
  if(!node) return {x:0,y:0};
  const dRect=diagram.getBoundingClientRect();
  const nRect=node.getBoundingClientRect();
  return {
    x: nRect.left - dRect.left + nRect.width/2,
    y: nRect.top  - dRect.top  + nRect.height/2
  };
}

function movePacket(nodeId, color='#00d4ff', emoji='📦'){
  const p=$('packet');
  const pos=getNodeCenter(nodeId);
  p.style.background=color;
  p.style.boxShadow=`0 0 18px ${color}80`;
  p.textContent=emoji;
  p.style.left=pos.x+'px';
  p.style.top=pos.y+'px';
  p.classList.add('visible');
  p.classList.remove('packet-pop');
  void p.offsetWidth;
  p.classList.add('packet-pop');
}

function hidePacket(){ $('packet').classList.remove('visible'); }

/* ══════════════════════════════════
   OVERLAY
══════════════════════════════════ */
function showOverlay(icon,title,color,sub,code,tap='[ tap to continue ]'){
  $('ov-icon').textContent=icon;
  $('ov-title').textContent=title; $('ov-title').style.color=color;
  $('ov-sub').innerHTML=sub;
  $('ov-code').innerHTML=code;
  $('ov-tap').textContent=tap;
  $('overlay').classList.add('show');
}
function closeOverlay(){
  $('overlay').classList.remove('show');
  if(overlayResolve){ overlayResolve(); overlayResolve=null; }
}
const waitOverlay=()=>new Promise(r=>{overlayResolve=r;});

/* ══════════════════════════════════
   RESET
══════════════════════════════════ */
function reset(){
  timers.forEach(clearTimeout); timers=[];
  running=false;
  dimAllNodes(); hidePacket();
  STEPS.forEach(s=>{ const e=$('step-'+s.id); if(e){ e.classList.remove('active','done'); } });
  $('log').innerHTML='';
  $('overlay').classList.remove('show');
  setPill('READY','var(--dim)');
  setStatus('Press Replay to start.');
  setInfo('READY','Watch a browser request travel the internet.','—','var(--dim)');
}

/* ══════════════════════════════════
   MAIN ANIMATION
══════════════════════════════════ */
async function startAnim(){
  if(running) return;
  reset();
  await delay(400);
  running=true;

  /* ── INTRO OVERLAY ── */
  showOverlay(
    '🌐','HOW THE INTERNET WORKS','var(--cyan)',
    `You type <strong style="color:var(--text)">example.com</strong> and hit Enter.<br>
     What happens next involves <strong style="color:var(--yellow)">DNS</strong>, <strong style="color:var(--cyan)">TCP</strong>,
     <strong style="color:var(--orange)">HTTP</strong>, <strong style="color:var(--purple)">routers</strong>,
     and a <strong style="color:var(--green)">server</strong> — all in milliseconds.`,
    `<span class="kw">You</span>  →  <span class="fn">DNS</span>  →  <span class="fn">Router</span>  →  <span class="fn">Internet</span>  →  <span class="fn">Server</span>\n<span class="cm">             ↑                                          ↓\n          Response  ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←</span>`
  );
  await waitOverlay();
  if(!running) return;

  setPill('RUNNING','var(--cyan)');

  /* ═══ STEP 1: DNS LOOKUP ═══ */
  activateStep('dns');
  activateNode('browser');
  setInfo('DNS LOOKUP','Your browser needs the IP address for "example.com". It asks the DNS server.',
          'Step 1 / 7','var(--yellow)');
  setStatus('Browser asks: "What is the IP of example.com?"','var(--yellow)');
  addLog('Browser → DNS: "Resolve example.com"','lc');
  await delay(1200);

  movePacket('browser','#ffd600','❓');
  await delay(900);
  movePacket('dns','#ffd600','❓');
  addLog('DNS server: searching records…','ly');
  await delay(1300);

  activateNode('dns');
  setStatus('DNS responds: "example.com = 93.184.216.34"','var(--yellow)');
  addLog('DNS → Browser: IP = 93.184.216.34 ✓','ly');
  movePacket('dns','#ffd600','📋');
  await delay(1100);
  movePacket('browser','#ffd600','📋');
  await delay(1000);
  hidePacket();
  doneStep('dns');
  dimAllNodes();
  await delay(900);

  /* ═══ STEP 2: TCP HANDSHAKE ═══ */
  activateStep('tcp');
  activateNode('browser');
  setInfo('TCP HANDSHAKE','Before sending data, browser & server do a 3-way handshake to open a connection.',
          'Step 2 / 7','var(--cyan)');
  setStatus('Browser → Server: SYN  (I want to connect)','var(--cyan)');
  addLog('TCP SYN sent → 93.184.216.34:443','lc');
  movePacket('browser','#00d4ff','🤝');
  await delay(900);
  movePacket('router','#00d4ff','🤝');
  await delay(900);
  movePacket('internet','#00d4ff','🤝');
  await delay(900);
  movePacket('server','#00d4ff','🤝');
  await delay(1100);

  activateNode('server');
  setStatus('Server → Browser: SYN-ACK  (OK, I hear you)','var(--cyan)');
  addLog('TCP SYN-ACK received ← server','lc');
  movePacket('server','#00ff88','↩️');
  await delay(900);
  movePacket('internet','#00ff88','↩️');
  await delay(900);
  movePacket('router','#00ff88','↩️');
  await delay(900);
  movePacket('browser','#00ff88','✅');
  await delay(1100);

  setStatus('Browser → Server: ACK  (Connection established!)','var(--cyan)');
  addLog('TCP ACK → connection established 🤝','lg');
  await delay(1000);
  hidePacket();
  doneStep('tcp');
  dimAllNodes();
  await delay(900);

  /* ═══ STEP 3: HTTP REQUEST ═══ */
  activateStep('http');
  activateNode('browser');
  setInfo('HTTP REQUEST','Browser sends a GET request asking for the webpage content.',
          'Step 3 / 7','var(--orange)');
  setStatus('Browser → Server: GET / HTTP/1.1','var(--orange)');
  addLog('GET / HTTP/1.1  Host: example.com','lo');
  movePacket('browser','#ff7b00','📤');
  await delay(900);
  movePacket('router','#ff7b00','📤');
  await delay(900);
  movePacket('internet','#ff7b00','📤');
  await delay(900);
  movePacket('server','#ff7b00','📤');
  await delay(1200);
  hidePacket();
  doneStep('http');
  dimAllNodes();
  await delay(900);

  /* ═══ STEP 4: IP ROUTING ═══ */
  activateStep('route');
  activateNode('router');
  setInfo('IP ROUTING','Your request hops through multiple routers across the internet backbone to reach the server.',
          'Step 4 / 7','var(--purple)');
  setStatus('Packets hopping across routers via IP addresses…','var(--purple)');
  addLog('IP routing: TTL=64, hops across backbone','lp');

  // Animate multiple hops
  for(let hop=0;hop<3;hop++){
    movePacket('router','#7c3aed','🔀');
    await delay(600);
    movePacket('internet','#7c3aed','🔀');
    await delay(600);
  }
  await delay(700);
  hidePacket();
  doneStep('route');
  dimAllNodes();
  await delay(900);

  /* ═══ STEP 5: SERVER PROCESSING ═══ */
  activateStep('process');
  activateNode('server');
  setInfo('SERVER PROCESSING','The web server receives your request, reads files, queries the database, builds the HTML.',
          'Step 5 / 7','var(--green)');
  setStatus('Server processing request… reading files, querying DB','var(--green)');
  addLog('Server: reading index.html, querying DB…','lg');
  movePacket('server','#00ff88','⚙️');
  await delay(1400);
  addLog('Server: HTML built, 200 OK response ready','lg');
  movePacket('server','#00ff88','✅');
  await delay(1200);
  hidePacket();
  doneStep('process');
  dimAllNodes();
  await delay(900);

  /* ═══ STEP 6: HTTP RESPONSE ═══ */
  activateStep('response');
  activateNode('server');
  setInfo('HTTP RESPONSE','Server sends back the HTML, CSS, and JS. Status 200 OK = success!',
          'Step 6 / 7','var(--pink)');
  setStatus('Server → Browser: 200 OK + HTML payload','var(--pink)');
  addLog('HTTP/1.1 200 OK  Content-Type: text/html','lp');
  movePacket('server','#f472b6','📥');
  await delay(900);
  movePacket('internet','#f472b6','📥');
  await delay(900);
  movePacket('router','#f472b6','📥');
  await delay(900);
  movePacket('browser','#f472b6','📥');
  await delay(1200);
  hidePacket();
  doneStep('response');
  dimAllNodes();
  await delay(900);

  /* ═══ STEP 7: BROWSER RENDER ═══ */
  activateStep('render');
  activateNode('browser');
  setInfo('BROWSER RENDER','Browser parses HTML → builds DOM → applies CSS → runs JS → paints pixels on screen.',
          'Step 7 / 7','var(--cyan)');
  setStatus('Browser: parsing HTML, building DOM, painting…','var(--cyan)');
  addLog('DOM built → CSSOM → Render Tree → Paint 🎨','lc');
  movePacket('browser','#00d4ff','🎨');
  await delay(1400);
  setStatus('Done! Page is visible on your screen 🎉','var(--green)');
  addLog('Page rendered! Total ~200ms from keypress','lg');
  movePacket('browser','#00ff88','🌐');
  await delay(1200);
  hidePacket();
  doneStep('render');

  // Light up full path
  NODES.forEach(n=>{ $('node-'+n.id).classList.add('active'); });
  await delay(1200);

  if(!running) return;

  /* ── FINAL OVERLAY ── */
  showOverlay(
    '🚀','ALL IN ~200ms!','var(--green)',
    `DNS lookup → TCP handshake → HTTP request →<br>
     IP routing → server processing → HTTP response → render.<br>
     <strong style="color:var(--text)">Billions of times per second, all over the planet.</strong>`,
    `<span class="kw">DNS</span>     → <span class="fn">~20ms</span>    <span class="cm">// if not cached</span>\n<span class="kw">TCP</span>     → <span class="fn">~1 RTT</span>   <span class="cm">// SYN SYN-ACK ACK</span>\n<span class="kw">HTTP</span>    → <span class="fn">~50ms</span>   <span class="cm">// request + response</span>\n<span class="kw">Render</span>  → <span class="fn">~50ms</span>   <span class="cm">// parse, layout, paint</span>`,
    '[ tap to replay ]'
  );
  await waitOverlay();

  running=false;
  reset();
  startAnim();
}

/* ══════════════════════════════════
   BOOT
══════════════════════════════════ */
window.addEventListener('load',()=>{
  buildDiagram();
  buildTimeline();
  reset();
  setTimeout(startAnim, 600);
});

window.addEventListener('resize',()=>{
  drawLines();
});
</script>
</body>
</html>
